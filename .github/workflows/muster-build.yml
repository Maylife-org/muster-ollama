name: muster-build

# Build ollama + its llama-server runner (compiled from the muster-llama.cpp
# fork — where the cache lives) per OS. CPU-only, unsigned, manual trigger.
# The fork is checked out with actions/checkout (native auth) and handed to the
# build via OLLAMA_LLAMA_CPP_SOURCE, so nothing is cloned mid-build.
# Needs secret FORK_TOKEN: read access to the private muster-llama.cpp fork.

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Maylife-org/muster-llama.cpp
          token: ${{ secrets.FORK_TOKEN }}
          path: _fork
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Apply Ollama compat patches to the fork
        shell: bash
        run: |
          WS="${{ github.workspace }}"; WS="${WS//\\//}"
          cd _fork
          cmake -DPATCH_DIR="$WS/llama/compat" -DPATCH_LABEL=llama/compat -P "$WS/cmake/apply-git-patches.cmake"
      - name: Build (ollama + CPU llama-server payload, from the fork)
        env:
          CMAKE_GENERATOR: Ninja
          OLLAMA_LLAMA_CPP_SOURCE: ${{ github.workspace }}/_fork
        run: |
          cmake -B build . -DOLLAMA_VERSION=0.0.0-muster -DOLLAMA_MLX_BACKENDS=
          cmake --build build --parallel
      - name: Assemble drop-in folder (binary + ./lib/ollama)
        run: |
          mkdir -p out/lib
          cp ollama out/ollama
          cp -r build/lib/ollama out/lib/ollama
          echo "---- packaged ----"; ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-linux
          path: out

  windows:
    runs-on: windows-latest
    steps:
      - name: Force LF checkouts (so the LF compat patch applies)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Maylife-org/muster-llama.cpp
          token: ${{ secrets.FORK_TOKEN }}
          path: _fork
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - name: Install llvm-mingw (CPU compiler for GGML variants + CGO)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath "C:\Program Files\"
          $bin = (Resolve-Path "C:\Program Files\llvm-mingw-*-x86_64*\bin").Path
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # By name, not full path: Go's CGO splits $CC on spaces, and the full path
          # runs through "C:\Program Files". On PATH, the name resolves cleanly.
          echo "CC=x86_64-w64-mingw32-gcc.exe"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=x86_64-w64-mingw32-g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply Ollama compat patches to the fork
        shell: bash
        run: |
          WS="${{ github.workspace }}"; WS="${WS//\\//}"
          # Windows checkout can leave CRLF on text files; git apply needs the patch
          # and its target source to share line endings. Force LF on both.
          find llama/compat -name '*.patch' -exec sed -i 's/\r$//' {} +
          find _fork/src _fork/tools -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -exec sed -i 's/\r$//' {} +
          cd _fork
          cmake -DPATCH_DIR="$WS/llama/compat" -DPATCH_LABEL=llama/compat -P "$WS/cmake/apply-git-patches.cmake"
      - name: Build (ollama.exe + CPU llama-server payload, from the fork)
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          OLLAMA_LLAMA_CPP_SOURCE: ${{ github.workspace }}/_fork
        run: |
          cmake -B build . -DOLLAMA_VERSION=0.0.0-muster -DOLLAMA_MLX_BACKENDS=
          cmake --build build --parallel
      - name: Assemble drop-in folder
        shell: bash
        run: |
          mkdir -p out/lib
          cp ollama.exe out/ollama.exe
          cp -r build/lib/ollama out/lib/ollama
          echo "---- packaged ----"; ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-windows
          path: out

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Maylife-org/muster-llama.cpp
          token: ${{ secrets.FORK_TOKEN }}
          path: _fork
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ninja
        run: brew install ninja
      - name: Ensure Metal toolchain (llama-server embeds Metal on Apple arm64)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Apply Ollama compat patches to the fork
        shell: bash
        run: |
          WS="${{ github.workspace }}"; WS="${WS//\\//}"
          cd _fork
          cmake -DPATCH_DIR="$WS/llama/compat" -DPATCH_LABEL=llama/compat -P "$WS/cmake/apply-git-patches.cmake"
      - name: Build (ollama + llama-server payload, from the fork)
        env:
          CMAKE_GENERATOR: Ninja
          OLLAMA_LLAMA_CPP_SOURCE: ${{ github.workspace }}/_fork
        run: |
          cmake -B build . -DOLLAMA_VERSION=0.0.0-muster -DOLLAMA_MLX_BACKENDS=
          cmake --build build --parallel
      - name: Assemble drop-in folder
        run: |
          mkdir -p out/lib
          cp ollama out/ollama
          cp -r build/lib/ollama out/lib/ollama
          echo "---- packaged ----"; ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-darwin
          path: out
